name: AllOfMeCompanion
options:
  bundleIdPrefix: com.allofme
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: AllOfMeCompanion/Info.plist
    INFOPLIST_KEY_CFBundleDisplayName: AOM Companion
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    SHARING_BASE_URL: https://api.allofmeapp.com/
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      CODE_SIGN_ENTITLEMENTS: AllOfMeCompanion/Debug.entitlements
    Release:
      CODE_SIGN_ENTITLEMENTS: AllOfMeCompanion/Release.entitlements
targets:
  AllOfMeCompanion:
    type: application
    platform: iOS
    sources:
      - AllOfMeCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allofme.companion
schemes:
  AllOfMeCompanion:
    build:
      targets:
        AllOfMeCompanion: all
    run:
      config: Debug
    archive:
      config: Release
